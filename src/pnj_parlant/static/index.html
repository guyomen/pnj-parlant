<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PNJ parlants</title>
<link href="fonts/fonts.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<style>
  /* Trois colonnes : la scène (lieu, PNJ présents) | la discussion | préparation et réglages.
     Écran moyen : la scène et les réglages l'un sous l'autre à gauche ; téléphone : tout empilé,
     les réglages en dernier. */
  main { max-width: 100rem; margin: 0 auto; padding: 1.5rem; display: grid; gap: 1.5rem;
         grid-template-columns: minmax(0, 1fr); grid-template-areas: "scene" "talk" "reglages"; }
  .npc { grid-area: scene; }
  .talk { grid-area: talk; }
  .reglages { grid-area: reglages; }
  @media (min-width: 52rem) {
    main { grid-template-columns: 21rem minmax(0, 1fr); grid-template-rows: auto 1fr; align-items: start;
           grid-template-areas: "scene talk" "reglages talk"; }
  }
  @media (min-width: 84rem) {
    main { grid-template-columns: 21rem minmax(0, 1fr) 19rem; grid-template-rows: auto;
           grid-template-areas: "scene talk reglages"; }
    /* les colonnes de côté restent visibles pendant que la discussion défile */
    .npc, .reglages { position: sticky; top: 1.5rem; max-height: calc(100vh - 3rem); overflow-y: auto; }
  }

  /* Préparation et réglages : création, banque, options, état de la machine */
  .reglages { background: var(--surface); border-radius: 10px; padding: 1.25rem; }
  .reglages h2 { font: 400 1.3rem var(--display); margin: 0 0 .6rem; }
  .reglages .bloc + .bloc { margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  .reglages .gen { margin-top: 0; }

  /* Banque de PNJ */
  .bank .row { display: flex; gap: .5rem; margin-bottom: .5rem; flex-wrap: wrap; align-items: center; }
  .bank .row[hidden] { display: none; }

  /* Conversation */
  .talk { display: flex; flex-direction: column; min-height: 70vh; }
  .log { flex: 1; display: flex; flex-direction: column; gap: .9rem; padding-bottom: 1rem; }
  .line { max-width: 38rem; }
  .line.npc-line { font: 1.25rem/1.45 var(--display); }
  .line.pj { align-self: flex-end; text-align: right; color: var(--muted); }
  .line .who { display: block; font: 700 .85rem var(--body); color: var(--glass); }
  .line.pj .who { color: var(--muted); }
  .line .narration { color: var(--muted); font-size: .9em; }
  /* Un nom de couleur différente par PNJ de la scène */
  .line.npc-1 .who { color: var(--wax); }
  .line.npc-2 .who { color: var(--verdigris); }
  .usage { color: var(--muted); font-size: .85rem; margin-bottom: .75rem; }
  .usage progress { display: block; width: 100%; height: .55rem; margin: .35rem 0; accent-color: var(--glass); }
  .response-length { display: flex; align-items: center; gap: .4rem; margin-bottom: .75rem; flex-wrap: wrap; }
  .response-length span { color: var(--muted); font-size: .9rem; }
  .response-length button { padding: .3rem .7rem; font-size: .9rem; }
  .response-length button[aria-pressed=true] { outline: 2px solid var(--verdigris); outline-offset: 1px; }

  /* Lieu de la scène, personnes présentes, narration */
  .lieu { margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
  .lieu label { display: block; font: 400 1.3rem var(--display); margin-bottom: .4rem; }
  .lieu select { width: 100%; }
  .lieu-desc { color: var(--muted); font-style: italic; margin: .5rem 0 0; }
  .lieu-desc:empty { display: none; }
  .ici { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; align-items: center; }
  .ici:empty { display: none; }
  .ici .k { color: var(--muted); font-size: .9rem; }
  .ici button { padding: .3rem .7rem; font-size: .9rem; }
  .line.narration-line { align-self: center; text-align: center; max-width: 34rem; }
  .line.narration-line .text { color: var(--muted); font-style: italic; }
  .pnj-card .suit { display: block; margin: .3rem 0; color: var(--muted); font-size: .95rem; cursor: pointer; }
  .proposition { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: .8rem;
                 padding: .6rem .8rem; background: var(--surface); border-radius: 8px; }
  .proposition[hidden] { display: none; }
  .proposition span { flex: 1; min-width: 12rem; }

  /* Fiches des PNJ de la scène : la première en grand, les suivantes plus discrètes */
  .pnj-card.second { margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  .npc .pnj-card.second h1 { font-size: 1.7rem; }
  .pnj-card.second p { font-size: .95rem; }

  /* Options */
  .options label { display: block; margin-bottom: .4rem; cursor: pointer; }
  .options .sub { margin-left: 1.6rem; }
  .options .sub[hidden], .options .gen[hidden] { display: none; }
  .options .gen { margin-top: .4rem; }
  .options .hint { color: var(--muted); font-size: .9rem; }
  .actions { display: flex; flex-direction: column; gap: .4rem; }
  .actions button[hidden] { display: none; }
  /* État de la machine */
  .sys { margin-top: 1rem; font-size: .85rem; color: var(--muted); display: grid; gap: .35rem; }
  .sys .bar { height: .4rem; background: var(--line); border-radius: .2rem; overflow: hidden; }
  .sys .bar i { display: block; height: 100%; background: var(--glass); width: 0; transition: width .4s; }
  .sys .alert { color: #b3261e; font-weight: 700; }
  .status { min-height: 1.5rem; color: var(--muted); font-style: italic; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; border-top: 1px solid var(--line); padding-top: 1rem; }
  .ask { flex: 1 1 16rem; display: flex; gap: .5rem; }
  /* Le sceau de cire : l'élément fort de la page */
  .mic { width: 5.5rem; height: 5.5rem; flex: none; border-radius: 50%; border: none;
         background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--wax) 70%, white), var(--wax) 60%);
         color: var(--wax-ink); font: 400 1rem/1.1 var(--display);
         box-shadow: inset 0 0 0 5px color-mix(in srgb, var(--wax) 80%, black); }
  .mic[aria-pressed=true] { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: inset 0 0 0 5px color-mix(in srgb, var(--wax) 80%, black), 0 0 0 10px color-mix(in srgb, var(--wax) 25%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .mic[aria-pressed=true] { animation: none; outline: 4px solid var(--wax); } }
</style>
</head>
<body>
<main>
  <section class="npc" aria-live="polite">
    <div class="lieu" id="lieuBloc" hidden>
      <label for="lieuSel">Lieu</label>
      <select id="lieuSel"></select>
      <p class="lieu-desc" id="lieuDesc"></p>
      <div class="ici" id="ici"></div>
    </div>
    <div id="cards"><p class="empty">Aucun PNJ pour l’instant. Abordez quelqu’un ici, jouez un PNJ de la banque ou créez-en un.</p></div>
  </section>

  <section class="talk">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="status" id="status"></div>
    <div class="proposition" id="proposition" hidden>
      <span id="propTexte"></span>
      <button id="propOui">Y aller</button>
      <button class="ghost" id="propNon">Rester ici</button>
    </div>
    <div class="usage" id="usage" aria-live="polite">
      <div id="contextLabel"></div>
      <progress id="contextBar" max="1" value="0" aria-label="Utilisation de la fenêtre de contexte" hidden></progress>
      <div id="usageTotals"></div>
    </div>
    <div class="response-length" role="group" aria-label="Longueur des réponses">
      <span>Longueur :</span>
      <button class="ghost" type="button" data-length="short" aria-pressed="false">Courte</button>
      <button class="ghost" type="button" data-length="normal" aria-pressed="true">Normale</button>
      <button class="ghost" type="button" data-length="long" aria-pressed="false">Détaillée</button>
    </div>
    <div class="controls">
      <button class="mic" id="micBtn" aria-pressed="false" disabled>Parler</button>
      <div class="actions">
        <button class="ghost" id="stopBtn" title="Interrompre le PNJ (Échap)" hidden>Stop</button>
        <button class="ghost" id="discuterBtn" title="Un autre PNJ répond à celui qui vient de parler" hidden>Laissez-les discuter</button>
      </div>
      <form class="ask" id="askForm" onsubmit="return false">
        <input type="text" id="ask" placeholder="Ou tapez votre question…" aria-label="Question au PNJ" disabled>
        <button class="ghost" id="sendBtn" disabled>Envoyer</button>
      </form>
    </div>
  </section>

  <aside class="reglages" aria-label="Préparation et réglages">
    <div class="bloc">
      <h2>Nouveau PNJ</h2>
      <div class="gen">
        <input type="text" id="role" placeholder="Métier (ex. marchand de potions)" aria-label="Métier du PNJ">
        <button id="genBtn">Créer un PNJ</button>
      </div>
    </div>
    <div class="bloc bank">
      <h2>Banque de PNJ</h2>
      <div class="row">
        <select id="bankSel" aria-label="PNJ enregistrés"></select>
        <button id="loadBtn">Jouer</button>
        <button class="ghost" id="addBtn" title="Le PNJ rejoint la conversation en cours">Ajouter à la scène</button>
      </div>
      <div class="row">
        <button class="ghost" id="saveBtn">Sauvegarder</button>
        <button class="ghost" id="exportBtn">Exporter la conversation</button>
        <button class="ghost" id="importBtn" title="Reprendre une conversation exportée">Importer une conversation</button>
        <input type="file" id="importFichier" accept=".txt,text/plain" hidden>
        <a class="link" href="creation.html">Préparer les PNJ et le scénario →</a>
      </div>
      <div class="row" id="modelRow" hidden>
        <select id="modelSel" aria-label="Modèle local"></select>
      </div>
    </div>
    <div class="bloc options">
      <h2>Options</h2>
      <label><input type="checkbox" id="optInterrompre"> « Parler » interrompt le PNJ
        <span class="hint">: vous lui coupez la parole (barre d’espace aussi)</span></label>
      <label><input type="checkbox" id="optCoupure"> Couper le PNJ dès que vous parlez
        <span class="hint">: micro ouvert pendant qu’il parle ; casque conseillé, sinon sa propre voix peut le couper</span></label>
      <label><input type="checkbox" id="optMulti"> Plusieurs PNJ dans la scène</label>
      <div class="sub" id="multiOpts">
        <label><input type="checkbox" id="optIntervention"> Interventions spontanées
          <span class="hint">: un autre PNJ réagit parfois de lui-même</span></label>
        <label><input type="checkbox" id="optEntree"> Faire entrer un PNJ inventé d’après la conversation</label>
        <div class="gen" id="entreeRow">
          <input type="text" id="entree" placeholder="Qui ? (vide : au choix du modèle)" aria-label="PNJ à faire entrer">
          <button class="ghost" id="entreeBtn">Faire entrer</button>
        </div>
      </div>
    </div>
    <div class="sys" id="sys" aria-live="polite"></div>
  </aside>
</main>

<script type="module">
import { esc, segments, formatLine, interpelles, questionnes, memeVoix, consignesEntree, texteExport,
         nomFichierExport, lieuEvoque, arrivee, parLieu, norm, lireExport, sceneImportee,
         consignesRecreation, detecteurVoix } from "./js/scene.js";

const $ = (id) => document.getElementById(id);
let cfg = { tts: null, intervention: 0.3 };
let npcs = [];      // PNJ de la scène ; le premier est le principal
let history = [];   // toute la scène : [{ speaker: nom du PNJ, ou null pour le joueur, content }]
let dernier = null; // PNJ qui a parlé en dernier : il répond quand le joueur ne nomme personne
let rencontres = []; // tous les PNJ croisés depuis le début de la conversation (pour l'export)
let busy = false;
let responseLength = "normal";
let contextLimit = null;
let tokenUsage = { input: 0, output: 0, lastInput: null, lastOutput: 0, available: false };
const MAX_PNJ = 3;
let lieux = [];        // lieux du scénario
let lieuActuel = "";   // identifiant du lieu de la scène ("" : aucun)
let banque = [];       // PNJ de la banque : [{id, nom, metier, lieu}]
let proposition = null; // lieu où le joueur a proposé d'aller
let positions = {};    // nom du PNJ → lieu où il se trouve pendant la partie (sinon : son lieu habituel)
let ici = [];          // PNJ présents dans le lieu, hors scène (boutons « Aborder »)

const status = (t) => { $("status").textContent = t || ""; };
const hasard = (liste) => liste[Math.floor(Math.random() * liste.length)];

function afficherUsage() {
  const label = $("contextLabel"), bar = $("contextBar"), totals = $("usageTotals");
  bar.hidden = true;
  if (!tokenUsage.available) {
    label.textContent = contextLimit
      ? `Fenêtre de contexte : ${contextLimit.toLocaleString("fr-FR")} tokens (mesure au premier échange)`
      : "";
    totals.textContent = "";
    return;
  }
  const utilises = tokenUsage.lastInput + tokenUsage.lastOutput;
  if (contextLimit) {
    bar.max = contextLimit;
    bar.value = Math.min(utilises, contextLimit);
    bar.hidden = false;
    label.textContent = `Contexte (dernière requête + réponse) : ${utilises.toLocaleString("fr-FR")} / ` +
      `${contextLimit.toLocaleString("fr-FR")} tokens · reste ~${Math.max(0, contextLimit - utilises).toLocaleString("fr-FR")}`;
  } else {
    label.textContent = `Contexte au dernier échange : ${tokenUsage.lastInput.toLocaleString("fr-FR")} tokens · limite inconnue`;
  }
  totals.textContent = `Cumul : ${tokenUsage.input.toLocaleString("fr-FR")} tokens en entrée + ` +
    `${tokenUsage.output.toLocaleString("fr-FR")} en sortie`;
}

function reinitialiserUsage() {
  tokenUsage = { input: 0, output: 0, lastInput: null, lastOutput: 0, available: false };
  afficherUsage();
}

async function api(path, body, method = body === undefined ? "GET" : "POST") {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Erreur serveur (${r.status})`);
  return data;
}

// Lit une réponse NDJSON (un objet JSON par ligne) au fur et à mesure qu'elle arrive
async function apiStream(path, body, onItem, signal) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(body), signal });
  if (!r.ok) {
    const data = await r.json().catch(() => ({}));
    throw new Error(data.error || `Erreur serveur (${r.status})`);
  }
  const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;
    const lines = buf.split("\n");
    buf = lines.pop();  // ligne pas encore complète
    for (const line of lines) if (line.trim()) onItem(JSON.parse(line));
  }
  if (buf.trim()) onItem(JSON.parse(buf));
}

// --- Options (mémorisées dans ce navigateur) ----------------------------------
const OPTIONS = ["optInterrompre", "optCoupure", "optMulti", "optIntervention", "optEntree"];
const DESACTIVEES = ["optCoupure"];  // à essayer d'abord (écho des haut-parleurs) : désactivée par défaut

function loadOptions() {
  for (const id of OPTIONS) {
    let v = null;
    try { v = localStorage.getItem(id); } catch {}
    $(id).checked = v === null ? !DESACTIVEES.includes(id) : v === "1";  // le reste est activé par défaut
  }
}

function saveOptions() {
  for (const id of OPTIONS) try { localStorage.setItem(id, $(id).checked ? "1" : "0"); } catch {}
}

// Une sous-option ne compte que si « Plusieurs PNJ dans la scène » est cochée
const opt = (id) => $(id).checked && $("optMulti").checked;

// --- Affichage ---------------------------------------------------------------
// qui : le PNJ qui parle, ou null pour le joueur
function addLine(qui, text) {
  const div = document.createElement("div");
  div.className = qui ? `line npc-line npc-${Math.max(0, npcs.indexOf(qui)) % MAX_PNJ}` : "line pj";
  div.innerHTML = `<span class="who">${qui ? esc(qui.nom) : "Vous"}</span><span class="text">${formatLine(text)}</span>`;
  $("log").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

// Narration (arrivée dans un lieu…) : ni nom, ni bulle, lue par la voix du narrateur
function addNarration() {
  const div = document.createElement("div");
  div.className = "line narration-line";
  div.innerHTML = `<span class="text"></span>`;
  $("log").appendChild(div);
  return div;
}

const nomDuLieu = (id) => lieux.find(l => l.id === id)?.nom;

function renderCards() {
  $("cards").innerHTML = npcs.length ? npcs.map((n, i) => `
    <div class="pnj-card${i ? " second" : ""}">
      <h1>${esc(n.nom)}</h1>
      <p class="metier">${esc(n.metier)}</p>
      <p>${esc(n.apparence)}</p>
      <p><span class="k">Caractère :</span> ${esc(n.personnalite)}</p>
      <p><span class="k">Humeur :</span> ${esc(n.humeur)}</p>
      ${nomDuLieu(lieuActuel) ? `<p><span class="k">Se trouve :</span> ${esc(nomDuLieu(lieuActuel))}</p>` : ""}
      ${nomDuLieu(n.lieu) && n.lieu !== lieuActuel
        ? `<p><span class="k">Lieu habituel :</span> ${esc(nomDuLieu(n.lieu))}</p>` : ""}
      ${lieux.length ? `<label class="suit"><input type="checkbox" data-suit="${i}" ${n.suit ? "checked" : ""}>
        Vous accompagne quand vous changez de lieu</label>` : ""}
      ${i ? `<button class="ghost" data-retirer="${i}">Retirer de la scène</button>` : ""}
    </div>`).join("")
    : `<p class="empty">Aucun PNJ pour l’instant. Abordez quelqu’un ici, jouez un PNJ de la banque ou créez-en un.</p>`;
}

// Bloc « Lieu » : menu, description, PNJ de la banque qui se trouvent ici
function renderLieu() {
  $("lieuBloc").hidden = !lieux.length;
  $("lieuSel").innerHTML = `<option value="">— Aucun lieu —</option>`
    + lieux.map(l => `<option value="${esc(l.id)}">${esc(l.nom)}</option>`).join("");
  $("lieuSel").value = lieuActuel;
  const lieu = lieux.find(l => l.id === lieuActuel);
  $("lieuDesc").textContent = lieu?.description ?? "";
  // PNJ de la banque, et PNJ croisés pendant la partie (même inventés, pas encore enregistrés)
  const connus = [...banque, ...rencontres.filter(r => !banque.some(b => b.nom === r.nom))];
  ici = lieu ? connus.filter(c => (positions[c.nom] ?? c.lieu) === lieu.id && !npcs.some(n => n.nom === c.nom)) : [];
  $("ici").innerHTML = !lieu ? ""
    : ici.length ? `<span class="k">Ici :</span>` + ici.map((c, i) =>
        `<button class="ghost" data-aborder="${i}">${esc(c.nom)} — ${esc(c.metier)}</button>`).join("")
    : `<span class="k">Personne d’autre ici.</span>`;
  renderBanque();
  setBusy(busy);
}

// Menu de la banque, regroupé par lieu où se trouve chaque PNJ pendant la partie (le lieu actuel d'abord)
function renderBanque() {
  const choisi = $("bankSel").value;
  const option = (n) => `<option value="${esc(n.id)}">${esc(n.nom)} — ${esc(n.metier)}</option>`;
  const groupes = parLieu(banque, lieux, positions, lieuActuel);
  $("bankSel").innerHTML = !banque.length ? `<option value="">Banque vide</option>`
    : !lieux.length ? banque.map(option).join("")
    : groupes.map(g => `<optgroup label="${esc(g.lieu ? g.lieu.nom + (g.lieu.id === lieuActuel ? " (vous êtes ici)" : "")
                                                    : "Sans lieu")}">${g.pnjs.map(option).join("")}</optgroup>`).join("");
  if (banque.some(n => n.id === choisi)) $("bankSel").value = choisi;
}

function setBusy(b) {
  busy = b;
  const scene = npcs.length > 0, multi = $("optMulti").checked;
  $("genBtn").disabled = b;
  $("sendBtn").disabled = $("ask").disabled = b || !scene;
  // pendant que le PNJ parle, « Parler » lui coupe la parole (option)
  const interrompre = !!parole && $("optInterrompre").checked;
  const ecoute = $("micBtn").getAttribute("aria-pressed") === "true";  // reste cliquable pour finir
  $("micBtn").disabled = !ecoute && ((b && !interrompre) || !scene || !(cfg.stt_local || recognition));
  $("saveBtn").disabled = b || !npcs.some(n => !n.id);  // tous déjà dans la banque
  $("exportBtn").disabled = !rencontres.length;
  $("importBtn").disabled = b;
  $("lieuSel").disabled = b;
  $("propOui").disabled = b;
  for (const btn of document.querySelectorAll("[data-aborder]")) {
    btn.disabled = b || (npcs.length >= MAX_PNJ && multi);
  }
  $("loadBtn").disabled = b || !$("bankSel").value;
  $("addBtn").hidden = !multi;
  $("addBtn").disabled = b || !scene || npcs.length >= MAX_PNJ || !$("bankSel").value
                         || npcs.some(n => n.id === $("bankSel").value);
  $("multiOpts").hidden = !multi;
  $("entreeRow").hidden = !opt("optEntree");
  $("entreeBtn").disabled = b || !scene || npcs.length >= MAX_PNJ;
  $("discuterBtn").hidden = !multi || npcs.length < 2;
  $("discuterBtn").disabled = b;
  for (const btn of document.querySelectorAll("[data-retirer]")) btn.disabled = b;
  if (!b) { const a = attentesLibre; attentesLibre = []; a.forEach(r => r()); }
}

// Attend la fin de l'action en cours (utile quand le joueur a coupé la parole au PNJ : sa question
// part une fois que la réplique interrompue a fini de se ranger dans l'historique).
let attentesLibre = [];
const libre = () => busy ? new Promise(r => attentesLibre.push(r)) : Promise.resolve();

// --- Voix des PNJ ------------------------------------------------------------
// Prise de parole en cours : { ctrl, stop }. Le bouton Stop annule les requêtes (réponse du modèle,
// synthèses en préparation) via ctrl, et coupe le son qui joue via stop().
let parole = null;

function debutParole() {
  parole = { ctrl: new AbortController(), stop: null };
  $("stopBtn").hidden = false;
  setBusy(busy);  // « Parler » devient un bouton pour interrompre
  arreterVeille();
  veiller(parole);
  return parole;
}

function finParole(p) {
  if (parole !== p) return;
  parole = null;
  arreterVeille();
  $("stopBtn").hidden = true;
  setBusy(busy);
}

// --- Couper la parole au PNJ en parlant (option) ------------------------------
// Pendant que le PNJ parle (ou réfléchit), le micro reste ouvert ; dès que le joueur parle assez fort et
// assez longtemps, le PNJ se tait et l'enregistrement continue avec le même micro : c'est sa question.
// La suppression d'écho du navigateur retire en principe la voix du PNJ, mais pas forcément celle de
// la synthèse du système (repli speechSynthesis) : avec des haut-parleurs, mieux vaut un casque.
let veille = null;  // { p, stream, ctx, timer, arret }

async function veiller(p) {
  if (!$("optCoupure").checked || !npcs.length || !(cfg.stt_local || recognition)) return;
  if ($("micBtn").getAttribute("aria-pressed") === "true") return;  // le joueur parle déjà
  const v = { p, stream: null, ctx: null, timer: null, arret: false };
  veille = v;
  try {
    v.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    if (v.arret) return fermerVeille(v);
    const rate = v.stream.getAudioTracks()[0]?.getSettings().sampleRate;
    v.ctx = rate ? new AudioContext({ sampleRate: rate }) : new AudioContext();
    if (v.ctx.state === "suspended") await v.ctx.resume();
    if (v.arret) return fermerVeille(v);
    const analyser = v.ctx.createAnalyser();
    v.ctx.createMediaStreamSource(v.stream).connect(analyser);
    const samples = new Float32Array(analyser.fftSize);
    const det = detecteurVoix();
    v.timer = setInterval(() => {
      analyser.getFloatTimeDomainData(samples);
      let sum = 0;
      for (const x of samples) sum += x * x;
      if (!det.ajouter(Math.sqrt(sum / samples.length), performance.now())) return;
      // Le joueur parle : on garde le micro pour l'enregistrer, on fait taire le PNJ
      clearInterval(v.timer); v.ctx.close();
      veille = null;
      stopNpc();
      if (cfg.stt_local) listenLocal({ stream: v.stream, bruit: det.bruit });
      else { v.stream.getTracks().forEach(t => t.stop()); recognition?.start(); }
    }, 50);
  } catch (e) {
    fermerVeille(v);
    if (veille === v) veille = null;
    if (e.name === "NotAllowedError") status("Micro refusé : impossible de couper le PNJ en parlant.");
  }
}

function fermerVeille(v) {
  clearInterval(v.timer);
  v.ctx?.close().catch(() => {});
  v.stream?.getTracks().forEach(t => t.stop());
}

function arreterVeille() {
  if (!veille) return;
  veille.arret = true;  // getUserMedia encore en attente : le micro sera refermé à son retour
  fermerVeille(veille);
  veille = null;
}

function stopNpc() {
  const p = parole;
  if (!p) return;
  finParole(p);
  p.ctrl.abort();
  p.stop?.();
  if ("speechSynthesis" in window) speechSynthesis.cancel();  // repli navigateur : termine la lecture
  status("");
}

// Lance tout de suite la synthèse (Piper, Pocket TTS ou Edge) et renvoie une fonction qui joue
// le son : la phrase suivante se prépare ainsi pendant que la précédente est lue.
// onStart(morceau) est appelé au moment où chaque morceau commence à être dit (pour l'afficher).
function prepareSpeech(text, p, onStart, n) {
  const plays = segments(text).map(([t, narrateur]) => prepareSegment(t, narrateur, p, onStart, n));
  return async () => { for (const play of plays) await play(); };
}

// n : le PNJ qui parle, ou null pour une narration seule (arrivée dans un lieu)
function prepareSegment(text, narrateur, p, onStart, n) {
  // eviter : le narrateur ne prend la voix d'aucun PNJ de la scène
  const audioFile = cfg.tts && (narrateur || n?.voix?.name)
    ? fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" },
                          body: JSON.stringify({ text, voice: n?.voix ?? {}, narrateur,
                                                 eviter: npcs.map(x => x.voix).filter(Boolean) }),
                          signal: p.ctrl.signal })
        .then(r => r.ok ? r.blob() : null).catch(() => null)
    : Promise.resolve(null);
  return async () => {
    const blob = await audioFile;
    if (p.ctrl.signal.aborted) return;  // interrompu par Stop
    onStart?.(narrateur ? `(${text})` : text);
    if (!blob) return browserSpeak(text, narrateur, n);  // repli sur la voix du navigateur
    const audio = new Audio(URL.createObjectURL(blob));
    await new Promise((res) => {
      p.stop = () => { audio.pause(); res(); };
      audio.onended = res; audio.onerror = res; audio.play().catch(res);
    });
    URL.revokeObjectURL(audio.src);
  };
}

const speak = (text, p, onStart, n) => prepareSpeech(text, p, onStart, n)();

async function browserSpeak(text, narrateur, n) {
  if (!("speechSynthesis" in window)) return;
  await new Promise((res) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR";
    u.pitch = narrateur ? 1 : n?.voix?.browser_pitch ?? 1;
    u.rate = narrateur ? 1 : n?.voix?.browser_rate ?? 1;
    const fr = speechSynthesis.getVoices().filter(v => v.lang.startsWith("fr"));
    // le narrateur prend la première voix française, chaque PNJ une des suivantes
    if (fr.length) u.voice = fr[narrateur ? 0 : (1 + Math.max(0, npcs.indexOf(n))) % fr.length];
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}

// --- Scène : arrivée des PNJ -------------------------------------------------
// Le PNJ dit sa salutation ; chaque morceau s'affiche quand il est dit
async function saluer(n) {
  const p = debutParole();
  let line = null, said = "";
  await speak(n.salutation, p, (morceau) => {
    line ??= addLine(n, "");
    said += (said ? " " : "") + morceau;
    line.querySelector(".text").innerHTML = formatLine(said);
    line.scrollIntoView({ behavior: "smooth", block: "end" });
  }, n);
  finParole(p);
}

// Nouvelle scène avec ce PNJ seul, dans son lieu habituel s'il en a un (on va le voir là où il est).
async function startScene(n) {
  reinitialiserUsage();
  npcs = [n];
  history = [{ speaker: n.nom, content: n.salutation }];
  dernier = n;
  rencontres = [n];
  masquerProposition();
  if (nomDuLieu(positions[n.nom] ?? n.lieu)) lieuActuel = positions[n.nom] ?? n.lieu;
  if (lieuActuel) positions[n.nom] = lieuActuel;
  $("log").innerHTML = "";
  renderCards();
  renderLieu();
  status("");
  setBusy(true);
  await saluer(n);
}

// Le PNJ rejoint la scène en cours
async function joinScene(n) {
  if (npcs.some(x => x.nom === n.nom)) throw new Error(`${n.nom} est déjà dans la scène.`);
  if (npcs.some(x => memeVoix(x.voix, n.voix))) {  // deux PNJ de la scène n'ont jamais la même voix
    n.voix = await api("/api/voice", { ...n, eviter: npcs.map(x => x.voix) });
  }
  npcs.push(n);
  history.push({ speaker: n.nom, content: n.salutation });
  dernier = n;
  if (!rencontres.some(x => x.nom === n.nom)) rencontres.push(n);
  if (lieuActuel) positions[n.nom] = lieuActuel;
  renderCards();
  renderLieu();
  status("");
  setBusy(true);
  await saluer(n);
}

function retirer(i) {
  const [n] = npcs.splice(i, 1);
  if (dernier === n) dernier = npcs[0];
  renderCards();
  renderLieu();
  status(`${n.nom} quitte la scène.`);
}

// --- Lieux -------------------------------------------------------------------
// Change de lieu : les PNJ qui n'accompagnent pas le voyageur restent sur place, le narrateur décrit
// le nouveau lieu. Les compagnons gardent le souvenir de la conversation ; sans compagnon, elle repart à zéro.
async function changerLieu(id) {
  if (busy || id === lieuActuel) return;
  const lieu = lieux.find(l => l.id === id);
  masquerProposition();
  const restent = npcs.filter(n => !n.suit);
  npcs = npcs.filter(n => n.suit);
  if (!npcs.includes(dernier)) dernier = npcs[0] ?? null;
  if (lieuActuel) for (const n of restent) positions[n.nom] = lieuActuel;  // ils restent là où on les quitte
  lieuActuel = lieu ? id : "";
  for (const n of npcs) positions[n.nom] = lieuActuel || undefined;      // les compagnons suivent
  if (!npcs.length) history = [];
  else if (lieu) history.push({ speaker: null, content: `(Le voyageur et ses compagnons arrivent : ${lieu.nom}.)` });
  renderCards();
  renderLieu();
  if (!lieu) return;
  setBusy(true);
  const p = debutParole();
  let line = null, said = "";
  await speak(arrivee(lieu, restent), p, (morceau) => {
    line ??= addNarration();
    said += (said ? " " : "") + morceau;
    line.querySelector(".text").innerHTML = formatLine(said);
    line.scrollIntoView({ behavior: "smooth", block: "end" });
  }, null);
  finParole(p);
  setBusy(false);
}

// Aborder un PNJ qui se trouve dans le lieu (`i` : rang dans `ici`) : il rejoint la scène (ou la remplace,
// sans l'option « Plusieurs PNJ »), sans effacer ce qui a été dit jusque-là.
async function aborder(i) {
  const c = ici[i];
  if (busy || !c) return;
  setBusy(true); status("");
  try {
    // déjà croisé pendant la partie : on reprend sa fiche (voix, compagnon…) ; sinon, celle de la banque
    const n = rencontres.find(r => r.nom === c.nom) ?? await api(`/api/bank/${encodeURIComponent(c.id)}`);
    if (!$("optMulti").checked) { npcs = []; history = []; }
    await joinScene(n);
  } catch (e) { status(e.message); }
  setBusy(false);
  if (npcs.length) $("ask").focus();
}

function proposer(lieu) {
  proposition = lieu;
  $("propTexte").textContent = `Aller à : ${lieu.nom} ?`;
  $("proposition").hidden = false;
}

function masquerProposition() {
  proposition = null;
  $("proposition").hidden = true;
}

async function chargerLieux() {
  lieux = await api("/api/lieux").catch(() => []);
  if (!lieux.some(l => l.id === lieuActuel)) lieuActuel = "";
  renderLieu();
  renderCards();
}

async function generate() {
  setBusy(true); status("Le PNJ prend forme…");
  try { await startScene(await api("/api/npc/generate", { role: $("role").value, lieu: lieuActuel })); }
  catch (e) { status(e.message); }
  setBusy(false);
  if (npcs.length) $("ask").focus();
}

// Un PNJ inventé d'après la conversation entre dans la scène
async function faireEntrer() {
  if (busy || !npcs.length || npcs.length >= MAX_PNJ) return;
  const qui = $("entree").value.trim();
  setBusy(true); status("Quelqu’un approche…");
  const consignes = consignesEntree(history, npcs, qui);
  try {
    await joinScene(await api("/api/npc/generate", { consignes, lieu: lieuActuel }));  // un habitué du lieu
    $("entree").value = "";
  } catch (e) { status(e.message); }
  setBusy(false);
}

// --- Banque de PNJ -----------------------------------------------------------
async function refreshBank(selectId) {
  banque = await api("/api/bank").catch(() => []);
  renderLieu();  // remplit aussi le menu de la banque
  if (selectId) $("bankSel").value = selectId;
  setBusy(busy);
}

// ajout : le PNJ rejoint la scène en cours au lieu d'en commencer une nouvelle
async function loadFromBank(ajout) {
  setBusy(true); status("");
  try {
    const n = await api(`/api/bank/${encodeURIComponent($("bankSel").value)}`);
    await (ajout ? joinScene(n) : startScene(n));
  } catch (e) { status(e.message); }
  setBusy(false);
  if (npcs.length) $("ask").focus();
}

async function saveToBank() {
  try {
    const noms = [];
    for (const n of npcs.filter(n => !n.id)) {
      n.id = (await api("/api/bank", n)).id;
      noms.push(n.nom);
    }
    await refreshBank(npcs[0].id);
    status(`${noms.join(" et ")} ${noms.length > 1 ? "sont enregistrés" : "est enregistré"} dans la banque.`);
  } catch (e) { status(e.message); }
}

// --- Export de la conversation -----------------------------------------------
// Télécharge un fichier texte avec le dialogue tel qu'il est affiché (descriptions comprises).
function exportConversation() {
  const date = new Date();
  const lignes = [...$("log").querySelectorAll(".line")]
    .map(l => [l.querySelector(".who")?.textContent ?? "", l.querySelector(".text").textContent]);
  const texte = texteExport(lignes, rencontres, date, nomDuLieu(lieuActuel) ?? "");
  // BOM : le Bloc-notes de Windows affiche alors correctement les accents
  const bom = String.fromCharCode(0xFEFF);
  const url = URL.createObjectURL(new Blob([bom + texte], { type: "text/plain;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = nomFichierExport(rencontres, date);
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// --- Import d'une conversation exportée -----------------------------------------
// Reprend la conversation là où elle s'était arrêtée : même lieu, mêmes PNJ, même historique (le modèle
// s'en souvient). Les PNJ sont pris dans la banque ; ceux qui n'y sont pas (inventés en cours de partie)
// sont recréés par le modèle d'après leur nom, leur métier, leur apparence et ce qu'ils ont dit.
async function importerConversation(fichier) {
  if (busy) return;
  let lu;
  try { lu = lireExport(await fichier.text()); } catch (e) { status(e.message); return; }
  if (history.length > 1 && !confirm("Remplacer la conversation en cours par celle du fichier ?")) return;
  stopNpc();
  setBusy(true);
  try {
    const lieu = lieux.find(l => norm(l.nom) === norm(lu.lieu));
    const fiches = [];
    for (const p of lu.pnjs) {
      const enBanque = banque.find(b => b.nom === p.nom);
      let n = rencontres.find(r => r.nom === p.nom)
        ?? (enBanque && await api(`/api/bank/${encodeURIComponent(enBanque.id)}`));
      if (!n) {
        status(`${p.nom} n’est pas dans la banque : il reprend forme…`);
        n = await api("/api/npc/generate", { role: p.metier, nom: p.nom, lieu: lieu?.id ?? "",
                                             consignes: consignesRecreation(p, lu.lignes) })
          .catch((e) => { throw new Error(`Impossible de recréer ${p.nom} : ${e.message}`); });
        n = { ...n, nom: p.nom, metier: p.metier || n.metier, apparence: p.apparence || n.apparence };
      }
      fiches.push(n);
    }
    rencontres = fiches;
    npcs = sceneImportee(lu.lignes, $("optMulti").checked ? MAX_PNJ : 1).map(nom => fiches.find(f => f.nom === nom));
    for (let i = 1; i < npcs.length; i++) {  // deux PNJ de la scène n'ont jamais la même voix
      const avant = npcs.slice(0, i);
      if (avant.some(x => memeVoix(x.voix, npcs[i].voix))) {
        npcs[i].voix = await api("/api/voice", { ...npcs[i], eviter: avant.map(x => x.voix) });
      }
    }
    const parle = lu.lignes.map(([qui]) => qui).filter(qui => npcs.some(n => n.nom === qui));
    dernier = npcs.find(n => n.nom === parle.at(-1)) ?? npcs[0] ?? null;
    lieuActuel = lieu?.id ?? "";
    for (const n of npcs) positions[n.nom] = lieuActuel || undefined;
    // sans PNJ dans la scène, la conversation repart de zéro (comme en arrivant seul dans un lieu)
    history = !npcs.length ? [] : lu.lignes.map(([qui, t]) => ({ speaker: qui && qui !== "Vous" ? qui : null, content: t }));
    reinitialiserUsage();
    masquerProposition();
    $("log").innerHTML = "";
    for (const [qui, t] of lu.lignes) {
      if (!qui) addNarration().querySelector(".text").innerHTML = formatLine(t);
      else addLine(qui === "Vous" ? null : fiches.find(f => f.nom === qui), t);
    }
    renderCards();
    renderLieu();
    status(!npcs.length ? "Conversation importée. Personne n’est resté avec vous : abordez quelqu’un ou jouez un PNJ."
      : lu.lieu && !lieu ? `Conversation importée. Le lieu « ${lu.lieu} » n’existe plus dans le scénario.`
      : "Conversation importée : vous pouvez la reprendre.");
  } catch (e) { status(e.message); }
  setBusy(false);
  if (npcs.length) $("ask").focus();
}

// --- Dialogue : qui répond ? --------------------------------------------------
// Option « Interventions spontanées » : de temps en temps, un autre PNJ réagit à la suite
function avecIntervention(ordre) {
  const restants = npcs.filter(n => !ordre.includes(n));
  if (opt("optIntervention") && restants.length && Math.random() < (cfg.intervention ?? 0.3)) {
    ordre.push(hasard(restants));
  }
  return ordre;
}

async function send(text) {
  text = text.trim();
  if (!text || !npcs.length || busy) return;
  $("ask").value = "";
  addLine(null, text);
  history.push({ speaker: null, content: text });
  // « Allons à la forge » : on propose d'y aller (les PNJ répondent quand même, ils peuvent réagir)
  const evoque = lieuEvoque(text, lieux, lieuActuel);
  if (evoque) proposer(evoque); else masquerProposition();
  // Le PNJ cité répond (tous ceux cités, dans l'ordre) ; sinon, celui qui a parlé en dernier
  const cites = interpelles(text, npcs);
  await jouerTours(cites.length > 1 ? cites
    : avecIntervention(cites.length ? cites : [npcs.includes(dernier) ? dernier : npcs[0]]));
}

// Bouton « Laissez-les discuter » : un autre PNJ répond à celui qui vient de parler
async function discuter() {
  if (busy || npcs.length < 2) return;
  const autres = npcs.filter(n => n !== dernier);
  await jouerTours(avecIntervention([hasard(autres)]));
}

// Les PNJ de `ordre` parlent l'un après l'autre. Chacun commence à écrire sa réplique pendant
// que le précédent parle encore, et l'entend en entier avant de répondre.
// Un PNJ à qui un autre pose une question répond juste après (au plus MAX_TOURS répliques d'affilée).
const MAX_TOURS = 4;

async function jouerTours(ordre) {
  setBusy(true);
  const p = debutParole();
  let voice = Promise.resolve();
  const tours = [], file = [...ordre];
  while (file.length && tours.length < MAX_TOURS) {
    const n = file.shift();
    if (p.ctrl.signal.aborted || !npcs.includes(n)) break;
    const t = await tourDe(n, p, voice);
    tours.push(t);
    voice = t.voice;
    if (t.erreur) break;
    for (const appele of questionnes(t.reply, n, npcs).reverse()) {
      const deja = file.indexOf(appele);
      if (deja >= 0) file.splice(deja, 1);
      file.unshift(appele);  // il répond avant les suivants prévus, une seule fois
    }
  }
  await voice;
  // Interrompu : chacun « se souvient » seulement de ce qu'il a eu le temps de dire
  if (p.ctrl.signal.aborted) tours.forEach(t => t.corriger());
  finParole(p);
  setBusy(false);
}

// Réplique d'un PNJ : préparée phrase par phrase dès qu'elle arrive, affichée quand elle est dite.
// Renvoie quand le modèle a fini d'écrire ; t.voice se termine quand le PNJ a fini de parler.
async function tourDe(n, p, voice) {
  let line = null, reply = "", said = "", erreur = null;
  const entry = { speaker: n.nom, content: "" };
  voice = voice.then(() => {
    if (!line && !erreur && !p.ctrl.signal.aborted) status(`${n.nom} réfléchit…`);
  });
  const show = (morceau) => {
    if (!line) { line = addLine(n, ""); status(""); }
    said += (said ? " " : "") + morceau;
    line.querySelector(".text").innerHTML = formatLine(said);
    line.scrollIntoView({ behavior: "smooth", block: "end" });
  };
  try {
    const corps = { npc: n, presents: npcs.filter(x => x !== n), history, lieu: lieuActuel };
    corps.longueur = responseLength;
    await apiStream("/api/npc/talk", corps, (item) => {
      if (p.ctrl.signal.aborted) return;
      if (item.error) throw new Error(item.error);
      if (item.usage) {
        tokenUsage.lastInput = item.usage.input_tokens;
        tokenUsage.lastOutput = item.usage.output_tokens;
        tokenUsage.input += item.usage.input_tokens;
        tokenUsage.output += item.usage.output_tokens;
        tokenUsage.available = true;
        afficherUsage();
        return;
      }
      reply += (reply ? " " : "") + item.phrase;
      voice = voice.then(prepareSpeech(item.phrase, p, show, n));
    }, p.ctrl.signal);
  } catch (e) {
    if (!p.ctrl.signal.aborted) { erreur = e; status(e.message); }
  }
  if (reply) {
    entry.content = reply;
    history.push(entry);
    dernier = n;
  }
  return {
    voice, erreur, reply,
    corriger() {
      if (!reply) return;
      if (said) entry.content = said;
      else history.splice(history.indexOf(entry), 1);
    },
  };
}

// --- Reconnaissance vocale du joueur ------------------------------------------
// Sur le serveur (faster-whisper, sans réseau) si config.toml le prévoit,
// sinon dans le navigateur (Web Speech API de Chrome / Edge, qui passe par internet).
function micPressed(on) {
  $("micBtn").setAttribute("aria-pressed", on ? "true" : "false");
  $("micBtn").textContent = on ? "J’écoute" : "Parler";
  setBusy(busy);  // le bouton reste cliquable pendant l'écoute, pour la terminer
}

let stopListening = () => recognition?.stop();

// ouvert : { stream, bruit } quand le joueur vient de couper la parole au PNJ (micro déjà ouvert,
// bruit de fond déjà mesuré, voix déjà entendue)
async function listenLocal(ouvert = null) {
  let stream = ouvert?.stream;
  if (!stream) try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  } catch (e) {
    status("Micro refusé. Autorisez-le dans le navigateur (et utilisez localhost ou HTTPS).");
    return;
  }
  let rec, ctx, analyser;
  const chunks = [];
  try {
    rec = new MediaRecorder(stream);
    rec.ondataavailable = (e) => chunks.push(e.data);
    // Arrêt automatique après une seconde de silence, comme la reconnaissance du navigateur.
    // Firefox exige que l'AudioContext ait la même fréquence que le micro.
    const rate = stream.getAudioTracks()[0]?.getSettings().sampleRate;
    ctx = rate ? new AudioContext({ sampleRate: rate }) : new AudioContext();
    if (ctx.state === "suspended") await ctx.resume();
    analyser = ctx.createAnalyser();
    ctx.createMediaStreamSource(stream).connect(analyser);
  } catch (e) {
    stream.getTracks().forEach(t => t.stop());
    status(`Micro inutilisable : ${e.message}`);
    return;
  }
  const samples = new Float32Array(analyser.fftSize);
  const start = performance.now();
  // Seuil adaptatif : bruit de fond mesuré pendant la première demi-seconde, voix = nettement au-dessus.
  let heard = !!ouvert, lastSound = start, peak = 0, noise = ouvert?.bruit ?? 0;
  const calibrage = ouvert ? 0 : 500;
  const timer = setInterval(() => {
    analyser.getFloatTimeDomainData(samples);
    let sum = 0;
    for (const x of samples) sum += x * x;
    const level = Math.sqrt(sum / samples.length);
    const now = performance.now();
    peak = Math.max(peak, level);
    if (now - start < calibrage) noise = Math.max(noise, level);
    const seuil = Math.max(0.004, noise * 3);
    if (now - start >= calibrage && level > seuil) { heard = true; lastSound = now; }
    status(`J’écoute… niveau ${"▮".repeat(Math.min(20, Math.round(level * 200)))}`);
    if ((heard && now - lastSound > 1200) || (!heard && now - start > 8000) || now - start > 30000) stopListening();
  }, 100);

  stopListening = () => { if (rec.state !== "inactive") rec.stop(); };

  rec.onstop = async () => {
    clearInterval(timer); ctx.close(); stream.getTracks().forEach(t => t.stop());
    micPressed(false);
    // Même si le seuil n'a rien détecté, on laisse Whisper (qui filtre le silence) trancher,
    // sauf si le micro est réellement muet (signal nul : mauvais périphérique ou micro coupé).
    if (!heard && peak < 0.0005) {
      status("Micro muet : aucun signal reçu. Vérifiez le périphérique d’entrée choisi par le navigateur.");
      return;
    }
    await libre();  // réplique interrompue : elle finit de se ranger avant la question
    setBusy(true); status("Je transcris…");
    let text = "";
    try {
      const form = new FormData();
      form.append("audio", new Blob(chunks, { type: rec.mimeType }), "micro.webm");
      form.append("indice", `Dialogue avec ${npcs.map(n => `${n.nom}, ${n.metier}`).join(" ; ")}.`);
      const r = await fetch("/api/stt", { method: "POST", body: form });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `Erreur serveur (${r.status})`);
      text = data.text;
      status(text ? "" : "Je n’ai pas compris. Recommencez ou tapez votre question.");
    } catch (e) { status(e.message); }
    setBusy(false);
    if (text) send(text);
  };
  rec.start();
  micPressed(true);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
if (SR) {
  recognition = new SR();
  recognition.lang = "fr-FR";
  recognition.interimResults = true;
  recognition.continuous = false;
  let finalText = "";
  recognition.onstart = () => { finalText = ""; micPressed(true); };
  recognition.onresult = (ev) => {
    let interim = "";
    for (const r of ev.results) (r.isFinal ? (finalText = r[0].transcript) : (interim += r[0].transcript));
    $("ask").value = finalText || interim;
  };
  recognition.onerror = (ev) => {
    status(ev.error === "not-allowed"
      ? "Micro refusé. Autorisez-le dans le navigateur (et utilisez localhost ou HTTPS)."
      : `Reconnaissance vocale : ${ev.error}`);
  };
  recognition.onend = async () => {
    micPressed(false);
    if (!finalText) return;
    await libre();  // réplique interrompue : elle finit de se ranger avant la question
    send(finalText);
  };
}

$("micBtn").onclick = () => {
  if ($("micBtn").getAttribute("aria-pressed") === "true") return stopListening();
  if ($("micBtn").disabled) return;
  stopNpc();  // le joueur coupe la parole au PNJ (le bouton n'est actif pendant qu'il parle qu'avec l'option)
  if (cfg.stt_local) listenLocal();
  else recognition?.start();
};
$("stopBtn").onclick = stopNpc;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") stopNpc();
  // Barre d'espace = bouton « Parler », sauf quand on écrit ou qu'un autre bouton a le focus
  if (e.key === " " && !e.repeat && !e.target.closest?.("input, textarea, select, button, a, [contenteditable]")) {
    e.preventDefault();
    $("micBtn").click();
  }
});
$("genBtn").onclick = generate;
$("loadBtn").onclick = () => loadFromBank(false);
$("addBtn").onclick = () => loadFromBank(true);
$("saveBtn").onclick = saveToBank;
$("exportBtn").onclick = exportConversation;

$("importFichier").onchange = async () => {
  const fichier = $("importFichier").files[0];
  $("importFichier").value = "";  // pour pouvoir réimporter le même fichier
  if (fichier) await importerConversation(fichier);
};
$("discuterBtn").onclick = discuter;
$("entreeBtn").onclick = faireEntrer;
$("entree").addEventListener("keydown", (e) => { if (e.key === "Enter") faireEntrer(); });
$("cards").onclick = (e) => {
  const i = e.target.dataset?.retirer;
  if (i !== undefined && !busy) retirer(Number(i));
};
$("cards").onchange = (e) => {  // case « Vous accompagne »
  const i = e.target.dataset?.suit;
  if (i !== undefined && npcs[Number(i)]) npcs[Number(i)].suit = e.target.checked;
};
$("lieuSel").onchange = () => changerLieu($("lieuSel").value);
$("ici").onclick = (e) => { if (e.target.dataset?.aborder !== undefined) aborder(Number(e.target.dataset.aborder)); };
$("propOui").onclick = () => { if (proposition) changerLieu(proposition.id); };
$("propNon").onclick = masquerProposition;
for (const id of OPTIONS) $(id).onchange = () => { saveOptions(); setBusy(busy); };
$("optCoupure").addEventListener("change", () => { arreterVeille(); if (parole) veiller(parole); });
loadOptions();
$("bankSel").onchange = () => setBusy(busy);
$("modelSel").onchange = async () => {
  const r = await fetch("/api/model", {method: "POST", headers: {"Content-Type": "application/json"},
                                       body: JSON.stringify({modele: $("modelSel").value})});
  const d = await r.json();
  status(r.ok ? `Modèle : ${d.modele_local} (le premier échange le charge, il peut être lent).` : d.error);
};
$("sendBtn").onclick = () => send($("ask").value);
$("role").addEventListener("keydown", (e) => { if (e.key === "Enter") generate(); });
document.querySelectorAll("[data-length]").forEach((button) => {
  button.onclick = () => {
    responseLength = button.dataset.length;
    document.querySelectorAll("[data-length]").forEach((option) => {
      option.setAttribute("aria-pressed", option === button ? "true" : "false");
    });
  };
});

fetch("/api/config").then(r => r.json()).then(c => {
  cfg = c;
  contextLimit = c.contexte_max;
  afficherUsage();
  if (c.modeles_locaux.length) {
    $("modelSel").innerHTML = c.modeles_locaux.map(m =>
      `<option value="${esc(m.nom)}">${esc(m.nom)} (${(m.taille / 1e9).toFixed(1)} Go)</option>`).join("");
    $("modelSel").value = c.modele_local;
    $("modelRow").hidden = false;
  }
  setBusy(busy);
  if (!c.stt_local && !recognition) status("La saisie vocale demande Chrome ou Edge. Vous pouvez taper vos questions.");
  else if (!c.tts) status("Synthèse vocale indisponible sur le serveur : la voix du navigateur sera utilisée.");
});
async function refreshSys() {
  const box = $("sys");
  try {
    const e = await (await fetch("/api/etat")).json();
    let h = "";
    if (e.ollama) {
      h += e.ollama.ok
        ? `<div>Ollama : actif${e.ollama.charges.length ? " — " + e.ollama.charges.map(m => `${esc(m.nom)} (${m.vram_mo} Mo en VRAM)`).join(", ") : " — aucun modèle chargé"}</div>`
        : `<div class="alert">Ollama ne répond pas : démarrez-le (sudo systemctl start ollama).</div>`;
    }
    if (e.gpu) {
      const pct = Math.round(100 * e.gpu.memoire_mo / e.gpu.memoire_totale_mo);
      h += `<div>${esc(e.gpu.nom)} : calcul ${e.gpu.usage} %, mémoire ${e.gpu.memoire_mo} / ${e.gpu.memoire_totale_mo} Mo</div>
            <div class="bar"><i style="width:${pct}%"></i></div>`;
    }
    box.innerHTML = h;
  } catch { box.innerHTML = `<div class="alert">Serveur injoignable.</div>`; }
}
refreshSys();
setInterval(() => { if (!document.hidden) refreshSys(); }, 3000);
setBusy(false);
chargerLieux().then(() => refreshBank());
