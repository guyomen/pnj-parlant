<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PNJ parlants</title>
<link href="fonts/fonts.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<style>
  main { max-width: 68rem; margin: 0 auto; padding: 1.5rem;
         display: grid; gap: 1.5rem; grid-template-columns: 1fr; }
  @media (min-width: 52rem) { main { grid-template-columns: 22rem 1fr; align-items: start; } }

  /* Banque de PNJ */
  .bank { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  .bank h2 { font: 400 1.3rem var(--display); margin: 0 0 .6rem; }
  .bank .row { display: flex; gap: .5rem; margin-bottom: .5rem; flex-wrap: wrap; align-items: center; }

  /* Conversation */
  .talk { display: flex; flex-direction: column; min-height: 70vh; }
  .log { flex: 1; display: flex; flex-direction: column; gap: .9rem; padding-bottom: 1rem; }
  .line { max-width: 38rem; }
  .line.npc-line { font: 1.25rem/1.45 var(--display); }
  .line.pj { align-self: flex-end; text-align: right; color: var(--muted); }
  .line .who { display: block; font: 700 .85rem var(--body); color: var(--glass); }
  .line.pj .who { color: var(--muted); }
  .status { min-height: 1.5rem; color: var(--muted); font-style: italic; }

  .controls { display: flex; align-items: center; gap: 1rem; border-top: 1px solid var(--line); padding-top: 1rem; }
  .ask { flex: 1; display: flex; gap: .5rem; }
  /* Le sceau de cire : l'élément fort de la page */
  .mic { width: 5.5rem; height: 5.5rem; flex: none; border-radius: 50%; border: none;
         background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--wax) 70%, white), var(--wax) 60%);
         color: var(--wax-ink); font: 400 1rem/1.1 var(--display);
         box-shadow: inset 0 0 0 5px color-mix(in srgb, var(--wax) 80%, black); }
  .mic[aria-pressed=true] { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: inset 0 0 0 5px color-mix(in srgb, var(--wax) 80%, black), 0 0 0 10px color-mix(in srgb, var(--wax) 25%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .mic[aria-pressed=true] { animation: none; outline: 4px solid var(--wax); } }
</style>
</head>
<body>
<main>
  <section class="npc" aria-live="polite">
    <div id="card"><p class="empty">Aucun PNJ pour l’instant. Choisissez un métier ou laissez le hasard décider.</p></div>
    <div class="gen">
      <input type="text" id="role" placeholder="Métier (ex. marchand de potions)" aria-label="Métier du PNJ">
      <button id="genBtn">Créer un PNJ</button>
    </div>
    <div class="bank">
      <h2>Banque de PNJ</h2>
      <div class="row">
        <select id="bankSel" aria-label="PNJ enregistrés"></select>
        <button id="loadBtn">Jouer</button>
      </div>
      <div class="row">
        <button class="ghost" id="saveBtn">Sauvegarder ce PNJ</button>
        <a class="link" href="creation.html">Préparer les PNJ et le scénario →</a>
      </div>
    </div>
  </section>

  <section class="talk">
    <div class="log" id="log" aria-live="polite"></div>
    <div class="status" id="status"></div>
    <div class="controls">
      <button class="mic" id="micBtn" aria-pressed="false" disabled>Parler</button>
      <form class="ask" id="askForm" onsubmit="return false">
        <input type="text" id="ask" placeholder="Ou tapez votre question…" aria-label="Question au PNJ" disabled>
        <button class="ghost" id="sendBtn" disabled>Envoyer</button>
      </form>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let cfg = { tts: null };
let npc = null;
let history = [];
let busy = false;

const status = (t) => { $("status").textContent = t || ""; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, body, method = body === undefined ? "GET" : "POST") {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Erreur serveur (${r.status})`);
  return data;
}

// Lit une réponse NDJSON (un objet JSON par ligne) au fur et à mesure qu'elle arrive
async function apiStream(path, body, onItem) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(body) });
  if (!r.ok) {
    const data = await r.json().catch(() => ({}));
    throw new Error(data.error || `Erreur serveur (${r.status})`);
  }
  const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value;
    const lines = buf.split("\n");
    buf = lines.pop();  // ligne pas encore complète
    for (const line of lines) if (line.trim()) onItem(JSON.parse(line));
  }
  if (buf.trim()) onItem(JSON.parse(buf));
}

function addLine(role, text) {
  const div = document.createElement("div");
  div.className = "line " + (role === "assistant" ? "npc-line" : "pj");
  div.innerHTML = `<span class="who">${role === "assistant" ? esc(npc.nom) : "Vous"}</span><span class="text">${esc(text)}</span>`;
  $("log").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

function renderCard() {
  $("card").innerHTML = `
    <h1>${esc(npc.nom)}</h1>
    <p class="metier">${esc(npc.metier)}</p>
    <p>${esc(npc.apparence)}</p>
    <p><span class="k">Caractère :</span> ${esc(npc.personnalite)}</p>
    <p><span class="k">Humeur :</span> ${esc(npc.humeur)}</p>
    <p><span class="k">Tic :</span> « ${esc(npc.tic_de_langage)} »</p>`;
}

function setBusy(b) {
  busy = b;
  for (const id of ["genBtn", "sendBtn", "ask"]) $(id).disabled = b || (id !== "genBtn" && !npc);
  $("micBtn").disabled = b || !npc || !(cfg.stt_local || recognition);
  $("saveBtn").disabled = b || !npc || !!npc.id;  // déjà dans la banque
  $("loadBtn").disabled = b || !$("bankSel").value;
}

// --- Voix du PNJ -------------------------------------------------------------
// Lance tout de suite la synthèse (Piper, Pocket TTS ou Edge) et renvoie une fonction qui joue
// le son : la phrase suivante se prépare ainsi pendant que la précédente est lue.
function prepareSpeech(text) {
  const audioFile = cfg.tts && npc.voix?.name
    ? fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" },
                          body: JSON.stringify({ text, voice: npc.voix }) })
        .then(r => r.ok ? r.blob() : null).catch(() => null)
    : Promise.resolve(null);
  return async () => {
    const blob = await audioFile;
    if (!blob) return browserSpeak(text);  // repli sur la voix du navigateur
    const audio = new Audio(URL.createObjectURL(blob));
    await new Promise((res) => { audio.onended = res; audio.onerror = res; audio.play().catch(res); });
  };
}

const speak = (text) => prepareSpeech(text)();

async function browserSpeak(text) {
  if (!("speechSynthesis" in window)) return;
  await new Promise((res) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR";
    u.pitch = npc.voix?.browser_pitch ?? 1;
    u.rate = npc.voix?.browser_rate ?? 1;
    const fr = speechSynthesis.getVoices().filter(v => v.lang.startsWith("fr"));
    if (fr.length) u.voice = fr[(npc.nom.length) % fr.length];
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}

// --- Création et dialogue ----------------------------------------------------
async function startNpc(newNpc) {
  npc = newNpc;
  history = [];
  $("log").innerHTML = "";
  renderCard();
  addLine("assistant", npc.salutation);
  status("");
  setBusy(true);
  await speak(npc.salutation);
}

async function generate() {
  setBusy(true); status("Le PNJ prend forme…");
  try { await startNpc(await api("/api/npc/generate", { role: $("role").value })); }
  catch (e) { status(e.message); }
  setBusy(false);
  if (npc) $("ask").focus();
}

// --- Banque de PNJ -----------------------------------------------------------
async function refreshBank(selectId) {
  const list = await api("/api/bank").catch(() => []);
  $("bankSel").innerHTML = list.length
    ? list.map(n => `<option value="${esc(n.id)}">${esc(n.nom)} — ${esc(n.metier)}</option>`).join("")
    : `<option value="">Banque vide</option>`;
  if (selectId) $("bankSel").value = selectId;
  setBusy(busy);
}

async function loadFromBank() {
  setBusy(true); status("");
  try { await startNpc(await api(`/api/bank/${encodeURIComponent($("bankSel").value)}`)); }
  catch (e) { status(e.message); }
  setBusy(false);
  if (npc) $("ask").focus();
}

async function saveToBank() {
  try {
    const { id } = await api("/api/bank", npc);
    npc.id = id;
    await refreshBank(id);
    status(`${npc.nom} est enregistré dans la banque.`);
  } catch (e) { status(e.message); }
}

async function send(text) {
  text = text.trim();
  if (!text || !npc || busy) return;
  $("ask").value = "";
  addLine("user", text);
  setBusy(true); status(`${npc.nom} réfléchit…`);
  let line = null, reply = "", voice = Promise.resolve();
  try {
    // Chaque phrase est affichée et lue dès qu'elle arrive, pendant que le modèle écrit la suite
    await apiStream("/api/npc/talk", { npc, history, message: text }, (item) => {
      if (item.error) throw new Error(item.error);
      if (!line) { line = addLine("assistant", ""); status(""); }
      reply += (reply ? " " : "") + item.phrase;
      line.querySelector(".text").textContent = reply;
      line.scrollIntoView({ behavior: "smooth", block: "end" });
      voice = voice.then(prepareSpeech(item.phrase));
    });
  } catch (e) { status(e.message); }
  if (reply) history.push({ role: "user", content: text }, { role: "assistant", content: reply });
  await voice;
  setBusy(false);
}

// --- Reconnaissance vocale du joueur ------------------------------------------
// Sur le serveur (faster-whisper, sans réseau) si config.toml le prévoit,
// sinon dans le navigateur (Web Speech API de Chrome / Edge, qui passe par internet).
function micPressed(on) {
  $("micBtn").setAttribute("aria-pressed", on ? "true" : "false");
  $("micBtn").textContent = on ? "J’écoute" : "Parler";
}

let stopListening = () => recognition?.stop();

async function listenLocal() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    status("Micro refusé. Autorisez-le dans le navigateur (et utilisez localhost ou HTTPS).");
    return;
  }
  const rec = new MediaRecorder(stream);
  const chunks = [];
  rec.ondataavailable = (e) => chunks.push(e.data);

  // Arrêt automatique après une seconde de silence, comme la reconnaissance du navigateur
  const ctx = new AudioContext();
  const analyser = ctx.createAnalyser();
  ctx.createMediaStreamSource(stream).connect(analyser);
  const samples = new Float32Array(analyser.fftSize);
  const start = performance.now();
  let heard = false, lastSound = start;
  const timer = setInterval(() => {
    analyser.getFloatTimeDomainData(samples);
    const level = Math.sqrt(samples.reduce((sum, x) => sum + x * x, 0) / samples.length);
    const now = performance.now();
    if (level > 0.02) { heard = true; lastSound = now; }
    if ((heard && now - lastSound > 1200) || (!heard && now - start > 8000) || now - start > 30000) stopListening();
  }, 100);

  stopListening = () => { if (rec.state !== "inactive") rec.stop(); };

  rec.onstop = async () => {
    clearInterval(timer); ctx.close(); stream.getTracks().forEach(t => t.stop());
    micPressed(false);
    if (!heard) { status("Je n’ai rien entendu."); return; }
    setBusy(true); status("Je transcris…");
    let text = "";
    try {
      const form = new FormData();
      form.append("audio", new Blob(chunks, { type: rec.mimeType }), "micro.webm");
      form.append("indice", `Dialogue avec ${npc.nom}, ${npc.metier}.`);
      const r = await fetch("/api/stt", { method: "POST", body: form });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || `Erreur serveur (${r.status})`);
      text = data.text;
      status(text ? "" : "Je n’ai pas compris. Recommencez ou tapez votre question.");
    } catch (e) { status(e.message); }
    setBusy(false);
    if (text) send(text);
  };
  rec.start();
  micPressed(true);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
if (SR) {
  recognition = new SR();
  recognition.lang = "fr-FR";
  recognition.interimResults = true;
  recognition.continuous = false;
  let finalText = "";
  recognition.onstart = () => { finalText = ""; micPressed(true); };
  recognition.onresult = (ev) => {
    let interim = "";
    for (const r of ev.results) (r.isFinal ? (finalText = r[0].transcript) : (interim += r[0].transcript));
    $("ask").value = finalText || interim;
  };
  recognition.onerror = (ev) => {
    status(ev.error === "not-allowed"
      ? "Micro refusé. Autorisez-le dans le navigateur (et utilisez localhost ou HTTPS)."
      : `Reconnaissance vocale : ${ev.error}`);
  };
  recognition.onend = () => {
    micPressed(false);
    if (finalText) send(finalText);
  };
}

$("micBtn").onclick = () => {
  if ($("micBtn").getAttribute("aria-pressed") === "true") return stopListening();
  speechSynthesis?.cancel();
  if (cfg.stt_local) listenLocal();
  else recognition?.start();
};
$("genBtn").onclick = generate;
$("loadBtn").onclick = loadFromBank;
$("saveBtn").onclick = saveToBank;
$("bankSel").onchange = () => setBusy(busy);
$("sendBtn").onclick = () => send($("ask").value);
$("role").addEventListener("keydown", (e) => { if (e.key === "Enter") generate(); });

fetch("/api/config").then(r => r.json()).then(c => {
  cfg = c;
  setBusy(busy);
  if (!c.stt_local && !recognition) status("La saisie vocale demande Chrome ou Edge. Vous pouvez taper vos questions.");
  else if (!c.tts) status("Synthèse vocale indisponible sur le serveur : la voix du navigateur sera utilisée.");
});
setBusy(false);
refreshBank();
</script>
</body>
</html>
